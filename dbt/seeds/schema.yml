version: 2

seeds:
  - name: states
    description: Справочник штатов США и их регионов.
    columns:
      - name: state_code
        description: Двухбуквенный код штата.
        data_tests:
          - not_null
          - unique
      - name: state_name
        description: Полное название штата.
        data_tests:
          - not_null
      - name: region
        description: Регион США.
        data_tests:
          - not_null
