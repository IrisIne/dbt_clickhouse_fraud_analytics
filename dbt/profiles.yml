fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '8123') | int }}"
      user: "{{ env_var('DBT_USER', 'pipeline_user') }}"
      password: "{{ env_var('DBT_PASSWORD', 'pipeline_password') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      secure: false
      verify: false
      threads: 4
